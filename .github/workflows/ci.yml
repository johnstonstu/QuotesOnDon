name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Quote store conforms to the schema
        run: npm run data:check

      - name: Tests
        run: npm test

      - name: Research reports are complete and sourced
        run: npm run check:research

      - name: Build
        run: npm run build

      - name: Built site exists and is not empty
        run: |
          test -f dist/index.html
          test -f dist/quotes-index.json
          test -f dist/rss.xml
          echo "pages built: $(find dist -name '*.html' | wc -l)"